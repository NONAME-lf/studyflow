name: studyflow

# Dev: `docker compose up -d` → postgres + mailpit; api/web run via `pnpm dev`.
# Full stack in containers (T-02): `docker compose --profile full up -d --build`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow
      POSTGRES_DB: studyflow
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studyflow -d studyflow']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://studyflow:studyflow@postgres:5432/studyflow
      JWT_ACCESS_SECRET: docker-access-secret
      JWT_REFRESH_SECRET: docker-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: StudyFlow <no-reply@studyflow.dev>
      REMINDER_CRON: '0 * * * *'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
